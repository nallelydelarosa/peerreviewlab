<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Peer Review Lab</title>

  <meta
    name="description"
    content="Peer Review Lab — peer reviewing modern life. Science, culture, pop culture, and the things the internet can't stop arguing about."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f3ed;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 0;
    }

    .eyebrow {
      margin-bottom: 24px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.06em;
    }

    .tagline {
      margin: 28px 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      font-style: italic;
    }

    .description {
      max-width: 650px;
      margin: 0 0 30px;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .links {
      display: flex;
      gap: 12px;
      margin-bottom: 35px;
    }

    .links a {
      padding: 11px 18px;
      border: 1px solid #171717;
      color: #171717;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .links a:first-child {
      background: #171717;
      color: #f7f3ed;
    }

    .topics {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.7;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      main {
        width: calc(100% - 30px);
      }

      .links {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <main>

    <div class="eyebrow">
      science • culture • receipts
    </div>

    <h1>Peer Review Lab</h1>

    <div class="tagline">
      peer reviewing modern life.
    </div>

    <p class="description">
      Science, culture, pop culture, and the things the internet
      can't stop arguing about.
    </p>

    <div class="links">

      <a
        href="https://www.instagram.com/peerreviewlab/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      <a
        href="https://www.tiktok.com/@peerreviewlab?_r=1&_t=ZP-98yCwH6cGHm"
        target="_blank"
        rel="noopener noreferrer"
      >
        TikTok
      </a>

    </div>

    <div class="topics">
      research • reality tv • relationships • internet discourse • people worth knowing
    </div>

  </main>

</body>
</html>
